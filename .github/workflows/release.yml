name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable matching release tag (publication requires owner approval)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: Flow-Steward/extensions/.github/workflows/release-extension.yml@296fa16dfec746f80c26bc05663ed9832c2043c2
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      expected_visibility: private
